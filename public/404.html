<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>VQBill — Đang chuyển hướng...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // Script này chuyển tiếp các request 404 trên GitHub Pages về index.html kèm tham số đường dẫn
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 50px; color: #475569;">
      <h2>Đang tải trang VQBill...</h2>
      <p>Vui lòng đợi trong giây lát.</p>
    </div>
  </body>
</html>

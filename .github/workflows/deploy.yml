name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đặt dependencies (legacy-peer-deps để tránh xung đột Vite/esbuild)
        run: npm install --legacy-peer-deps

      - name: Build ứng dụng (Vite)
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải lên artifact đã build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Xuất bản lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Quyền hạn cần thiết để đẩy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Giới hạn 1 tiến trình deploy đồng thời để tránh race condition
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci || npm install

      - name: Build ứng dụng (Vite)
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải lên artifact đã build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Xuất bản lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
